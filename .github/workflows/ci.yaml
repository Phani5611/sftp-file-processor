name: Build & Test

on:
  push:
    branches:
      - master
  #workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout 
        uses: actions/checkout@v6
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Verify Maven & JRE
        run: |
          java --version
          mvn --version
      - name: Download Maven Dependencies
        run: mvn dependency:go-offline
      - name: Start Compiling the Project
        run: mvn compile -DskipTests


